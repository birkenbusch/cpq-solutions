<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Teams-Hintergrund</title>
<style>
  @font-face { font-family: 'Jost'; font-weight: 400; src: url(../fonts/Jost-Regular.ttf); }
  @font-face { font-family: 'Jost'; font-weight: 500; src: url(../fonts/Jost-Medium.ttf); }
  html, body { margin: 0; background: #07111f; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../build/gears.js"></script>
<script>
/* Microsoft Teams: 1920 × 1080 px (16:9). Mitte bleibt ruhig (dort sitzt die Person),
   unten links blendet Teams den Namen ein – dort keine Inhalte. */
(async () => {
  const { C, setup, background, grid, gear, mesh } = CPQ;
  const params = new URLSearchParams(location.search);
  const variant = params.get('v') || 'logo';
  const W = 1920, H = 1080;
  const ctx = setup(document.getElementById('c'), W, H);

  background(ctx, W, H);
  grid(ctx, W, H, 60, 0.30, 0.8);

  // Cluster links (hinter der Schulter)
  const a = { x: -40, y: 560, r: 300, teeth: 96, angle: 0.2, alpha: 0.20, stroke: C.g3, lineW: 1.8 };
  const b = mesh(a, 36, -0.75, { alpha: 0.24, stroke: C.g4, lineW: 1.5 });
  const c = mesh(b, 20, -1.9, { alpha: 0.28, stroke: C.g5, lineW: 1.2 });
  // Cluster rechts unten
  const d = { x: 1830, y: 1010, r: 260, teeth: 84, angle: 0.6, alpha: 0.18, stroke: C.g2, lineW: 1.8 };
  const e = mesh(d, 32, -2.05, { alpha: 0.24, stroke: C.g4, lineW: 1.5 });
  const f = mesh(e, 18, -1.2, { alpha: 0.27, stroke: C.g5, lineW: 1.2 });
  // Akzente
  const g = { x: 1850, y: 340, r: 50, teeth: 18, angle: 0.4, alpha: 0.16, stroke: C.g2, lineW: 1.3 };
  const h = { x: 760, y: 40, r: 40, teeth: 16, angle: 0.1, alpha: 0.14, stroke: C.g2, lineW: 1.2 };
  [a, b, c, d, e, f, g, h].forEach(x => gear(ctx, x, 1.4));

  // Ruhige Mitte: weicher Schatten hinter der Person
  const m = ctx.createRadialGradient(W / 2, H * 0.62, 80, W / 2, H * 0.62, 640);
  m.addColorStop(0, 'rgba(7,17,31,0.85)'); m.addColorStop(1, 'rgba(7,17,31,0)');
  ctx.fillStyle = m; ctx.fillRect(0, 0, W, H);

  if (variant === 'logo') {
    await document.fonts.load('500 26px Jost');
    const logo = await CPQ.loadImage('../logo/logo-dunkel.svg');
    const lw = 420, lh = lw * logo.height / logo.width;
    const x = W - 80 - lw, y = 72;
    ctx.drawImage(logo, x, y, lw, lh);
    ctx.font = '500 22px Jost';
    ctx.fillStyle = C.accent;
    ctx.textAlign = 'right';
    ctx.letterSpacing = '3px';
    ctx.fillText('SENIOR CPQ-BERATER  ·  CAMOS® CPQ SPEZIALIST', W - 84, y + lh + 40);
  }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
